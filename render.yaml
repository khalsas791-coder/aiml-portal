services:
  - type: web
    name: gndecb-aiml-portal
    runtime: python
    buildCommand: pip install -r requirements.txt && python final_seed.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

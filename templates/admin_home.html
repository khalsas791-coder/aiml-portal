{% extends 'base.html' %}
{% block content %}
<h1>Edit Home Configuration</h1>
<div class="card" style="max-width: 800px;">
    <form method="POST">
        <div style="margin-bottom: 1.5rem;">
            <label>College Name</label>
            <input type="text" name="college_name" class="form-control" value="{{ home.college_name }}">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label>Hero Tagline</label>
            <input type="text" name="tagline" class="form-control" value="{{ home.tagline }}">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label>Introductory Paragraph</label>
            <textarea name="intro" class="form-control" rows="4">{{ home.intro }}</textarea>
        </div>
        <button type="submit" class="btn">Update Global Identity</button>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Manage Events{% endblock %}
{% block content %}
<input type="text" class="search-bar" placeholder="Search events by title...">
<div class="grid">
    {% for event in events %}
    <div class="item-card">
        <img src="{{ url_for('static', filename='images/' + event.image_path) }}" alt="{{ event.title }}" class="item-img">
        <div class="item-content">
            <h3 class="item-title">{{ event.title }}</h3>
            <p class="item-desc">{{ event.description }}</p>
        </div>
        <div class="item-actions">
            <a href="{{ url_for('edit_event', id=event.id) }}" class="btn" style="background:#3b82f6; text-decoration: none;">Edit</a>
            <form action="{{ url_for('delete_event', id=event.id) }}" method="POST" style="display:inline;" onsubmit="confirmDelete(event)">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </div>
    </div>
    {% else %}
    <p style="color: var(--text-secondary); grid-column: 1 / -1;">No events added yet. Go to 'Add Event' to create one.</p>
    {% endfor %}
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Add New Project{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px;">
    <form action="{{ url_for('add_project') }}" method="POST">
        <div class="form-group">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label for="project_title">Project Title</label>
            <input type="text" id="project_title" name="project_title" class="form-control" required placeholder="Ex: Advanced YOLO Object Detection">
        </div>
        <div class="form-group">
            <label for="description">Project Description
                <button type="button" onclick="generateDesc('project')" style="background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; float: right; transition: all 0.2s;">✨ AI Auto-Generate</button>
            </label>
            <textarea id="description" name="description" class="form-control" required rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="github_link">GitHub Link</label>
            <input type="url" id="github_link" name="github_link" class="form-control" required placeholder="https://github.com/...">
        </div>
        <button type="submit" class="btn">🚀 Save Project</button>
    </form>
</div>
{% endblock %}

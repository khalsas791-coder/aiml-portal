{% extends 'base.html' %}
{% block title %}Add Project{% endblock %}
{% block breadcrumb %}Add Project{% endblock %}
{% block content %}
<div class="page-header animate-in">
    <div>
        <h1 class="page-title">Add New Project</h1>
        <p class="page-desc">Add a student innovation project to the website.</p>
    </div>
    <a href="{{ url_for('view_projects') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card animate-in delay-1" style="max-width: 860px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Student Name</label>
                <input type="text" name="student_name" class="form-control" required placeholder="e.g., Rahul Sharma">
            </div>
            <div class="form-group">
                <label class="form-label">Project Title</label>
                <input type="text" id="project_title" name="project_title" class="form-control" required placeholder="e.g., IoT Smart Agricultural Bot">
            </div>
            <div class="form-group full">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <label class="form-label" style="margin:0;">Description</label>
                    <button type="button" class="btn btn-purple btn-sm" onclick="generateDesc('project')"><i data-lucide="sparkles"></i> Generate with AI</button>
                </div>
                <textarea id="description" name="description" class="form-control" rows="4" required placeholder="Describe the project..."></textarea>
            </div>
            <div class="form-group full">
                <label class="form-label">GitHub Link</label>
                <input type="url" name="github_link" class="form-control" required placeholder="https://github.com/...">
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i> Create Project</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

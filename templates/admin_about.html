{% extends 'base.html' %}
{% block title %}About & Vision{% endblock %}
{% block breadcrumb %}About & Vision{% endblock %}
{% block content %}
<div class="page-header animate-in">
    <div>
        <h1 class="page-title">About & Vision</h1>
        <p class="page-desc">Edit the About section text and the Vision statement displayed on the website.</p>
    </div>
</div>

<div class="card animate-in delay-1" style="max-width: 860px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">About Description</label>
            <textarea name="description" class="form-control" rows="6">{{ about.description }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Vision Statement</label>
            <textarea name="vision" class="form-control" rows="4">{{ about.vision }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Save Changes</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

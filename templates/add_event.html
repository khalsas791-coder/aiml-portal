{% extends 'base.html' %}
{% block title %}Add Event{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add New Event</h1>
        <p class="page-desc">Create a new technical event. Use AI to generate descriptions automatically.</p>
    </div>
    <a href="{{ url_for('view_events') }}" class="btn btn-ghost">← Back to Events</a>
</div>

<div class="card" style="max-width: 800px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group full">
                <label class="form-label">Event Title</label>
                <input type="text" id="title" name="title" class="form-control" required placeholder="e.g., Smart India Hackathon 2026">
            </div>
            <div class="form-group full">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <label class="form-label" style="margin:0;">Description</label>
                    <button type="button" class="btn btn-purple btn-sm" onclick="generateDesc('event')"><i data-lucide="sparkles"></i> Generate with AI</button>
                </div>
                <textarea id="description" name="description" class="form-control" rows="5" required placeholder="Describe the event..."></textarea>
            </div>
            <div class="form-group full">
                <label class="form-label">Event Image</label>
                <input type="file" name="image" class="form-control" accept="image/*">
                <p style="font-size:0.7rem; color:var(--text-muted); margin-top:6px;">Optional. Accepts PNG, JPG, WEBP (max 8MB).</p>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i> Create Event</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Add New Event{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px;">
    <form action="{{ url_for('add_event') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" name="title" class="form-control" required placeholder="Ex: Workshop on Neural Networks">
        </div>
        <div class="form-group" style="position: relative;">
            <label for="description">Event Description 
                <button type="button" onclick="generateDesc('event')" style="background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; float: right; transition: all 0.2s;">✨ AI Auto-Generate</button>
            </label>
            <textarea id="description" name="description" class="form-control" required rows="5" placeholder="Enter details..."></textarea>
        </div>
        <div class="form-group">
            <label for="image">Event Cover Image (JPG, PNG)</label>
            <input type="file" id="image" name="image" class="form-control" required accept="image/png, image/jpeg" onchange="previewImage(event)">
            <img id="previewOut" style="display:none; width:100%; height:200px; object-fit:cover; border-radius:8px; margin-top:10px; border: 1px solid var(--border);">
        </div>
        <button type="submit" class="btn">🚀 Upload Event</button>
    </form>
</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('previewOut');
        output.src = reader.result;
        output.style.display = 'block';
    };
    reader.readAsDataURL(event.target.files[0]);
}
</script>
{% endblock %}

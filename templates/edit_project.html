{% extends 'base.html' %}
{% block title %}Edit Project{% endblock %}
{% block breadcrumb %}Edit Project{% endblock %}
{% block content %}
<div class="page-header animate-in">
    <div>
        <h1 class="page-title">Edit Project</h1>
        <p class="page-desc">Update "{{ project.project_title }}".</p>
    </div>
    <a href="{{ url_for('view_projects') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card animate-in delay-1" style="max-width: 860px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Student Name</label>
                <input type="text" name="student_name" class="form-control" value="{{ project.student_name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Project Title</label>
                <input type="text" id="project_title" name="project_title" class="form-control" value="{{ project.project_title }}" required>
            </div>
            <div class="form-group full">
                <label class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4" required>{{ project.description }}</textarea>
            </div>
            <div class="form-group full">
                <label class="form-label">GitHub Link</label>
                <input type="url" name="github_link" class="form-control" value="{{ project.github_link }}" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Save Changes</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

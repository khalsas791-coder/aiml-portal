{% extends 'base.html' %}
{% block title %}Edit Project{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px;">
    <form action="{{ url_for('edit_project', id=project.id) }}" method="POST">
        <div class="form-group">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name" class="form-control" required value="{{ project.student_name }}">
        </div>
        <div class="form-group">
            <label for="project_title">Project Title</label>
            <input type="text" id="project_title" name="project_title" class="form-control" required value="{{ project.project_title }}">
        </div>
        <div class="form-group">
            <label for="description">Project Description</label>
            <textarea id="description" name="description" class="form-control" required rows="4">{{ project.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="github_link">GitHub Link</label>
            <input type="url" id="github_link" name="github_link" class="form-control" required value="{{ project.github_link }}">
        </div>
        <button type="submit" class="btn">💾 Update Project</button>
        <a href="{{ url_for('view_projects') }}" class="btn" style="background: transparent; border: 1px solid var(--border); margin-left: 1rem;">Cancel</a>
    </form>
</div>
{% endblock %}

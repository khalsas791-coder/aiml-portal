{% extends 'base.html' %}
{% block title %}Add Team Member{% endblock %}
{% block breadcrumb %}Add Team Member{% endblock %}
{% block content %}
<div class="page-header animate-in">
    <div>
        <h1 class="page-title">Add Team Member</h1>
        <p class="page-desc">Add a faculty member or student coordinator.</p>
    </div>
    <a href="{{ url_for('view_team') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card animate-in delay-1" style="max-width: 860px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Dr. Dhananjay M.">
            </div>
            <div class="form-group">
                <label class="form-label">Role / Designation</label>
                <input type="text" name="role" class="form-control" required placeholder="e.g., HOD — AIML Department">
            </div>
            <div class="form-group full">
                <label class="form-label">Profile Photo</label>
                <input type="file" name="image" class="form-control" accept="image/*">
                <p class="form-hint">Optional. Auto-generates initials avatar if not provided.</p>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i> Add Member</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

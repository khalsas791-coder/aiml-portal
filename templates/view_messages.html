{% extends 'base.html' %}
{% block content %}
<h1>Inbox: Neural Link Messages</h1>
<div class="card">
    {% for m in messages %}
    <div style="padding: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3 style="margin:0;">{{ m.name }} <span style="font-size:0.8rem; color:#8b949e; margin-left:10px;">{{ m.email }}</span></h3>
            <span style="font-size:0.75rem; color:#484f58;">{{ m.created_at }}</span>
        </div>
        <p style="font-size:0.95rem; line-height:1.6;">{{ m.message }}</p>
    </div>
    {% else %}
    <p>No messages received yet.</p>
    {% endfor %}
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="max-width: 450px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 2rem; color: var(--text-primary);">Secure <span style="color: var(--accent);">Login</span></h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Access the Neural System Console</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Log In to Dashboard</button>
        </form>
    </div>
</div>
{% endblock %}

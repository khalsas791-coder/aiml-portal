<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — GNDECB Neural Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 70%);
            top: -100px; left: -100px;
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
            bottom: -50px; right: -50px;
            border-radius: 50%;
            pointer-events: none;
        }
        .login-card {
            background: #131a2b;
            border: 1px solid rgba(148,163,184,0.08);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-logo {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #000;
            margin-bottom: 1rem;
        }
        .login-brand h2 { font-size: 1.5rem; font-weight: 800; }
        .login-brand h2 span { color: #38bdf8; }
        .login-brand p { color: #475569; font-size: 0.85rem; margin-top: 6px; }

        .flash-bar {
            padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem;
            font-size: 0.85rem; font-weight: 600;
            background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2);
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: #64748b; margin-bottom: 0.4rem; }
        .form-control {
            width: 100%; padding: 0.75rem 1rem;
            background: #0c1120;
            border: 1px solid rgba(148,163,184,0.08);
            border-radius: 8px; color: #e2e8f0;
            font-size: 0.9rem; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none; border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
        }
        .form-control::placeholder { color: #475569; }

        .btn-login {
            width: 100%; padding: 0.85rem;
            background: #38bdf8; color: #000;
            border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 700;
            cursor: pointer; margin-top: 0.5rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-login:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(56,189,248,0.3);
        }

        .login-footer {
            text-align: center; margin-top: 2rem;
            color: #475569; font-size: 0.75rem;
        }
        .login-footer a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo">AI</div>
            <h2>GNDECB <span>Admin</span></h2>
            <p>Neural Console — Secure Access</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="flash-bar">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign In to Dashboard</button>
        </form>

        <div class="login-footer">
            <a href="/">← Back to Website</a>
        </div>
    </div>
</body>
</html>

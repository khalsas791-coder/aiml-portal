{% extends 'base.html' %}
{% block title %}Edit Event{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Edit Event</h1>
        <p class="page-desc">Update the details for "{{ event.title }}".</p>
    </div>
    <a href="{{ url_for('view_events') }}" class="btn btn-ghost">← Back to Events</a>
</div>

<div class="card" style="max-width: 800px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label class="form-label">Event Title</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ event.title }}" required>
            </div>
            <div class="form-group full">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                    <label class="form-label" style="margin:0;">Description</label>
                    <button type="button" class="btn btn-purple btn-sm" onclick="generateDesc('event')"><i data-lucide="sparkles"></i> Regenerate with AI</button>
                </div>
                <textarea id="description" name="description" class="form-control" rows="5" required>{{ event.description }}</textarea>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Save Changes</button>
    </form>
</div>
<script>lucide.createIcons();</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Neural Console | GNDECB Bidar</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/ultra.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/admin-core.js?v=4.1" defer></script>
    <style>
        :root {
            --adm-bg: #020617;
            --adm-sidebar: #0f172a;
            --adm-accent: #38bdf8;
            --adm-border: rgba(255, 255, 255, 0.08);
        }
        body { background: var(--adm-bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        .adm-sidebar { width: 300px; background: var(--adm-sidebar); border-right: 1px solid var(--adm-border); display: flex; flex-direction: column; overflow-y: auto; }
        .adm-brand { padding: 3rem; border-bottom: 1px solid var(--adm-border); font-family: 'Outfit'; font-weight: 800; color: var(--adm-accent); letter-spacing: 2px; }
        .adm-nav { padding: 1.5rem 0; flex: 1; }
        .adm-btn { width: 100%; padding: 1.5rem 3rem; text-align: left; background: none; border: none; color: #94a3b8; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 1rem; font-weight: 600; font-family: 'Inter'; }
        .adm-btn:hover { background: rgba(56, 189, 248, 0.05); color: #fff; }
        .adm-btn.active { background: rgba(56, 189, 248, 0.1); color: var(--adm-accent); border-left: 4px solid var(--adm-accent); }
        .adm-main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        .adm-topbar { height: 80px; background: var(--adm-sidebar); border-bottom: 1px solid var(--adm-border); display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; }
        .adm-content { flex: 1; overflow-y: auto; padding: 4rem; }
        
        #login-barrier { position: fixed; inset: 0; background: #000; z-index: 100000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--adm-sidebar); padding: 5rem; border-radius: 40px; border: 1px solid var(--adm-border); width: 450px; text-align: center; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; background: rgba(255,255,255,0.02); border-radius: 20px; overflow: hidden; border: 1px solid var(--adm-border); }
        th { text-align: left; background: rgba(255,255,255,0.05); padding: 2rem; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; }
        td { padding: 2rem; border-bottom: 1px solid var(--adm-border); font-size: 0.9rem; }
        .badge { background: rgba(56, 189, 248, 0.1); color: var(--adm-accent); padding: 0.4rem 1rem; border-radius: 99px; font-size: 0.7rem; font-weight: 800; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        #toast { position: fixed; bottom: 3rem; right: 3rem; background: #10b981; color: #fff; padding: 1.5rem 3rem; border-radius: 16px; transform: translateY(300%); transition: 0.6s cubic-bezier(1,0,0,1); z-index: 100001; font-weight: 800; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="login-barrier">
        <div class="login-box">
            <h1 class="gradient-text" style="font-size: 3rem; margin-bottom: 1rem;">Neural Command</h1>
            <p style="color: #64748b; margin-bottom: 3rem;">GNDECB Enterprise v4.1</p>
            <input type="password" id="console-pass" placeholder="Enter Neural Key" style="width: 100%; background: #1e293b; border: 1px solid var(--adm-border); padding: 1.5rem; border-radius: 12px; color: #fff; text-align: center; margin-bottom: 2rem; font-size: 1rem;">
            <button class="btn-ultra" style="width: 100%;" onclick="accessConsole()">Authenticate Console</button>
        </div>
    </div>

    <aside class="adm-sidebar">
        <div class="adm-brand">GNDECB <span style="font-weight: 300; opacity: 0.5;">HUB</span></div>
        <nav class="adm-nav">
            <button class="adm-btn active" data-tab="faculty"><i data-lucide="users"></i> Faculty Hub</button>
            <button class="adm-btn" data-tab="projects"><i data-lucide="layers"></i> Projects</button>
            <button class="adm-btn" data-tab="notices"><i data-lucide="bell"></i> Notice Board</button>
            <button class="adm-btn" data-tab="calendar"><i data-lucide="calendar"></i> Academic Pulse</button>
            <button class="adm-btn" data-tab="testimonials"><i data-lucide="quote"></i> Consensus</button>
            <button class="adm-btn" data-tab="gallery"><i data-lucide="image"></i> Gallery Array</button>
        </nav>
        <div style="padding: 2rem; border-top: 1px solid var(--adm-border); font-size: 0.7rem; color: #475569;">
            Neural Orchestrator Production Build 4.1.2
        </div>
    </aside>

    <main class="adm-main">
        <div class="adm-topbar">
            <div style="font-family:'Outfit'; font-weight: 800; letter-spacing: 2px; color: var(--adm-accent);">NEURAL COMMAND CENTER</div>
            <div style="display:flex; gap:1.5rem;">
                <button class="btn-ultra" style="background:transparent; color:#fff; border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem 2rem; font-size: 0.8rem;" onclick="window.open('index.html')">View Hub Live</button>
            </div>
        </div>

        <div class="adm-content">
            <!-- Analytics Summary -->
            <div id="analytics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 5rem;">
                <!-- Dynamically populated counts -->
                <div class="skeleton" style="height: 100px;"></div>
                <div class="skeleton" style="height: 100px;"></div>
                <div class="skeleton" style="height: 100px;"></div>
                <div class="skeleton" style="height: 100px;"></div>
            </div>

            <!-- Management Area -->
            <div id="module-list-area">
                <!-- Data lists injected by admin-core.js -->
            </div>
        </div>
    </main>

    <div id="toast">Update Committed Successfully.</div>

    <script>
        // Internal Hook for global expose
        window.accessConsole = () => {}; 
    </script>
</body>
</html>

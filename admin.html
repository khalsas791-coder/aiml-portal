<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Enterprise Neural Orchestrator — GNDECB AIML</title>
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/ultra.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="js/admin-core.js" defer></script>
<style>
  :root {
    --adm-bg: #020617;
    --adm-sidebar: #0f172a;
    --adm-accent: #38bdf8;
    --adm-border: rgba(255, 255, 255, 0.08);
  }
  body { background: var(--adm-bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
  .adm-sidebar { width: 280px; background: var(--adm-sidebar); border-right: 1px solid var(--adm-border); display: flex; flex-direction: column; overflow-y: auto; }
  .adm-brand { padding: 2.5rem; border-bottom: 1px solid var(--adm-border); font-family: 'Outfit'; font-weight: 800; font-size: 1.2rem; color: var(--adm-accent); }
  .adm-nav { padding: 1rem 0; flex: 1; }
  .adm-btn { width: 100%; padding: 1.2rem 2.5rem; text-align: left; background: none; border: none; color: #94a3b8; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 1rem; font-weight: 500; font-family: 'Inter'; }
  .adm-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
  .adm-btn.active { background: rgba(56, 189, 248, 0.1); color: var(--adm-accent); border-left: 4px solid var(--adm-accent); }
  .adm-main { flex: 1; display: flex; flex-direction: column; height: 100%; background: #020617; }
  .adm-topbar { height: 75px; background: var(--adm-sidebar); border-bottom: 1px solid var(--adm-border); display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; }
  .adm-content { flex: 1; overflow-y: auto; padding: 4rem; }
  #login-barrier { position: fixed; inset: 0; background: var(--adm-bg); z-index: 100000; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--adm-sidebar); padding: 5rem; border-radius: 40px; border: 1px solid var(--adm-border); width: 450px; text-align: center; }
  #toast { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff; padding: 1rem 2rem; border-radius: 12px; transform: translateY(200%); transition: 0.4s; z-index: 100001; font-weight: 600; }
  #toast.show { transform: translateY(0); }
</style>
</head>
<body>

<div id="login-barrier">
    <div class="login-box">
        <h1 class="gradient-text" style="font-family:'Outfit'; font-size:3.5rem; margin-bottom: 1rem;">Enterprise Hub</h1>
        <p style="color: #94a3b8; margin-bottom: 3rem;">Neural Orchestrator v4.0.1</p>
        <input type="password" id="console-pass" placeholder="Neural Access Key" style="width: 100%; background: #1e293b; border: 1px solid var(--adm-border); padding: 1.2rem; border-radius: 12px; color: #fff; text-align: center; margin-bottom: 2rem;">
        <button class="btn-ultra" style="width: 100%;" onclick="accessConsole()">Authenticate Uplink</button>
    </div>
</div>

<aside class="adm-sidebar">
    <div class="adm-brand">AIML <span style="font-weight: 300; opacity: 0.5;">ADMIN</span></div>
    <nav class="adm-nav">
        <button class="adm-btn active" data-tab="faculty"><i data-lucide="users"></i> Faculty Hub</button>
        <button class="adm-btn" data-tab="projects"><i data-lucide="layers"></i> Projects</button>
        <button class="adm-btn" data-tab="testimonials"><i data-lucide="quote"></i> Consensus</button>
        <button class="adm-btn" data-tab="events"><i data-lucide="calendar"></i> Pulse Events</button>
        <button class="adm-btn" data-tab="gallery"><i data-lucide="image"></i> Visual Array</button>
    </nav>
</aside>

<main class="adm-main">
    <div class="adm-topbar">
        <div style="font-family:'Outfit'; font-weight: 800; letter-spacing: 2px;">NEURAL COMMAND CENTER</div>
        <div style="display:flex; gap:1.5rem;">
            <button class="btn-ultra" style="background:transparent; color:#fff; border: 1px solid rgba(255,255,255,0.1);" onclick="window.open('index.html')">View Neural Live</button>
        </div>
    </div>
    <div class="adm-content" id="module-list-area">
        <!-- Main Interface Dynamically Injected by admin-core.js -->
    </div>
</main>

<div id="toast">Neural Node Committed.</div>

<script>
    // Local Access Function (Exposed to admin-core.js)
    function accessConsole() {
        // This is handled by admin-core.js global expose
    }
</script>
</body>
</html>

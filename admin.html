<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Static Admin Dashboard — GNDECB AIML</title>

<!-- Standard Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet"/>

<!-- Styles -->
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/components.css"/>
<link rel="stylesheet" href="css/sections.css"/>
<link rel="stylesheet" href="css/premium.css"/>

<style>
  :root {
    --admin-bg: #020617;
    --admin-sidebar: #0f172a;
    --admin-accent: #fbbf24; /* Gold */
    --admin-border: rgba(255,255,255,0.08);
  }
  
  body { background: var(--admin-bg); color: #fff; font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden; display: flex; }
  
  /* Sidebar */
  .sidebar { width: 260px; background: var(--admin-sidebar); border-right: 1px solid var(--admin-border); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-header { padding: 2rem; border-bottom: 1px solid var(--admin-border); }
  .sidebar-nav { padding: 1rem 0; }
  .sidebar-btn { width: 100%; text-align: left; padding: 1rem 2rem; background: none; border: none; color: #94a3b8; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; }
  .sidebar-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
  .sidebar-btn.active { background: rgba(251,191,36,0.1); color: var(--admin-accent); border-left: 3px solid var(--admin-accent); }
  
  /* Main Content */
  .main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
  .topbar { height: 70px; background: var(--admin-sidebar); border-bottom: 1px solid var(--admin-border); display: flex; align-items: center; justify-content: space-between; padding: 0 3rem; }
  .content-area { flex: 1; overflow-y: auto; padding: 3rem; }
  
  /* Form Elements */
  .edit-panel { background: rgba(255,255,255,0.02); border: 1px solid var(--admin-border); border-radius: 16px; padding: 2.5rem; display: none; margin-bottom: 2rem; }
  .edit-panel.active { display: block; animation: fadeIn 0.4s easeOut; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .form-group { margin-bottom: 2rem; }
  label { display: block; color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  input, textarea, select { width: 100%; background: #1e293b; border: 1px solid var(--admin-border); border-radius: 12px; padding: 1rem; color: #fff; font-size: 1rem; transition: 0.3s; }
  input:focus, textarea:focus { border-color: var(--admin-accent); outline: none; background: #0f172a; }
  textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  
  /* Section Header */
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: var(--admin-accent); margin-bottom: 1rem; }
  .section-desc { color: #94a3b8; margin-bottom: 3rem; }
  
  /* Buttons */
  .btn-publish { background: var(--admin-accent); color: #000; padding: 0.75rem 1.5rem; border: none; border-radius: 99px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 0.6rem; }
  .btn-publish:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(251,191,36,0.3); }
  
  /* Split View */
  #split-preview { width: 400px; height: 100%; border-left: 1px solid var(--admin-border); background: #000; }
  iframe { width: 100%; height: 100%; border: none; }
  
  /* Login Overlay */
  #login-overlay { position: fixed; inset: 0; background: var(--admin-bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--admin-sidebar); padding: 4rem; border-radius: 24px; border: 1px solid var(--admin-border); width: 450px; text-align: center; }
  
  /* Notification */
  #toast { position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff; padding: 1rem 2rem; border-radius: 12px; transform: translateY(200%); transition: 0.4s; z-index: 10001; font-weight: 600; }
  #toast.show { transform: translateY(0); }
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div style="font-size: 3rem; margin-bottom: 1.5rem;">👑</div>
    <h1 style="margin-bottom: 0.5rem;">Admin Access</h1>
    <p style="color: #94a3b8; margin-bottom: 2.5rem;">GNDECB AIML Static Portal Controller</p>
    <input type="password" id="admin-pass" placeholder="Enter Administration Passphrase" style="text-align: center; margin-bottom: 1.5rem;">
    <button class="btn-publish" style="width: 100%; justify-content: center;" onclick="checkAccess()">Enter Dashboard</button>
  </div>
</div>

<aside class="sidebar">
  <div class="sidebar-header">
    <div style="color: var(--admin-accent); font-weight: 800; font-size: 1.2rem; letter-spacing: 2px;">GNDECB <span style="color:#fff">ADMIN</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <button class="sidebar-btn active" data-target="hero">🚀 Hero Section</button>
    <button class="sidebar-btn" data-target="about">🏛 About College</button>
    <button class="sidebar-btn" data-target="aiml">🤖 AIML Dept</button>
    <button class="sidebar-btn" data-target="faculty">🎓 Faculty Grid</button>
    <button class="sidebar-btn" data-target="courses">📚 Curriculum</button>
    <button class="sidebar-btn" data-target="achievements">🏆 Achievements</button>
    <button class="sidebar-btn" data-target="placements">💼 Placements</button>
    <button class="sidebar-btn" data-target="facilities">🏫 Facilities</button>
    <button class="sidebar-btn" data-target="projects">📁 Projects</button>
    <button class="sidebar-btn" data-target="resources">💾 Resources</button>
    <button class="sidebar-btn" data-target="ai-tools">✨ AI Tools Hub</button>
    <button class="sidebar-btn" data-target="cgpa">🧮 CGPA Calc</button>
    <button class="sidebar-btn" data-target="events">📅 Events Hub</button>
    <button class="sidebar-btn" data-target="gallery">🖼 Photo Gallery</button>
    <button class="sidebar-btn" data-target="faq">❓ FAQ Center</button>
    <button class="sidebar-btn" data-target="contact">📞 Contact Us</button>
    <button class="sidebar-btn" data-target="global" style="border-top: 1px solid var(--admin-border);">🌍 Global Settings</button>
  </nav>
  <div style="margin-top:auto; padding: 2rem; border-top: 1px solid var(--admin-border); font-size: 0.75rem; color: #64748b;">
    Static CMS v3.0 (Pure Vanilla)
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div id="active-title">Hero Section Editor</div>
    <div style="display: flex; gap: 1rem;">
      <button class="btn-publish" style="background: rgba(255,255,255,0.05); color: #fff;" onclick="previewChanges()">👁 Preview</button>
      <button class="btn-publish" onclick="exportWebsite()">💾 Download index.html</button>
      <button class="btn-publish" style="background: var(--neon-cyan); color: #000;" id="github-publish-btn" onclick="publishToGitHub()">🚀 Publish Live</button>
    </div>
  </div>

  <div class="content-area" id="editor-forms">
    <!-- Forms will be dynamically populated here by static-admin.js -->
    <div id="loading" style="text-align: center; margin-top: 10rem;">
        <div class="loader"></div>
        <p style="color:#94a3b8; margin-top: 1rem;">Syncing with index.html...</p>
    </div>
  </div>
</main>

<div id="split-preview">
    <iframe id="preview-frame" src="index.html"></iframe>
</div>

<div id="toast">Changes Saved Locally!</div>

<script src="js/static-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | GNDECB AIML</title>
  <style>
    :root {
      --bg-a: #020617;
      --bg-b: #0f172a;
      --card: rgba(15, 23, 42, 0.72);
      --line: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.18), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(34, 197, 94, 0.12), transparent 35%),
        linear-gradient(160deg, var(--bg-a), var(--bg-b));
      padding: 20px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(2, 6, 23, 0.45);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
      letter-spacing: 0.2px;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.55);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      color: #02101a;
      background: linear-gradient(90deg, var(--accent), #7dd3fc);
    }

    .hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .msg {
      min-height: 20px;
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .msg.error { color: var(--danger); }
    .msg.ok { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Neural Command Center</h1>
    <p>Sign in to open the admin dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Admin Email</label>
        <input id="email" type="email" autocomplete="username" required value="admin@gndecb.ac.in" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>

      <button type="submit">Open Admin Panel</button>
      <div id="message" class="msg"></div>
      <div class="hint">Current login: <strong>admin@gndecb.ac.in</strong> with password <strong>admin123</strong></div>
    </form>
  </main>

  <script>
    const ADMIN_EMAIL = "admin@gndecb.ac.in";
    const ADMIN_PASSWORD = "admin123";
    const AUTH_KEY = "aiml_admin_session";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    const showMessage = (text, type) => {
      message.textContent = text;
      message.className = `msg ${type}`;
    };

    if (localStorage.getItem(AUTH_KEY) === "active") {
      window.location.href = "dashboard.html";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        localStorage.setItem(AUTH_KEY, "active");
        showMessage("Login successful. Redirecting...", "ok");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 400);
        return;
      }

      showMessage("Invalid email or password.", "error");
    });
  </script>
</body>
</html>
